<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUNI TECHNO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090c;
      --surface: #0f1117;
      --border: #1a1e27;
      --accent-off: #ff2a44;
      --accent-on: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.4);
      --text: #f0f2f5;
      --dim: #6e7687;
      --mono: 'JetBrains Mono', monospace;
      --display: 'Cabinet Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 50% 35%, rgba(0, 255, 136, 0.03) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
    }

    .app-card {
      width: 100%;
      max-width: 380px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(14, 16, 22, 0.85);
      backdrop-filter: blur(24px);
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      background: rgba(255, 42, 68, 0.12);
      border: 1px solid rgba(255, 42, 68, 0.3);
      color: var(--accent-off);
      transition: all 0.3s ease;
    }

    .badge-status.live {
      background: rgba(0, 255, 136, 0.12);
      border-color: rgba(0, 255, 136, 0.35);
      color: var(--accent-on);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }

    .badge-status.live .dot {
      animation: blink 1.4s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .app-title {
      font-family: var(--display);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .bpm-tag {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.08em;
    }

    /* Center Visualizer & Power Button */
    .center-stage {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    #radarCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .power-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 30%, #1e2330, #0a0c10);
      border: 2px solid #232a38;
      box-shadow: 
        0 14px 32px rgba(0, 0, 0, 0.8),
        inset 0 2px 4px rgba(255, 255, 255, 0.1),
        inset 0 -4px 8px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      outline: none;
      z-index: 2;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .power-btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.95);
    }

    .power-btn.on {
      border-color: var(--accent-on);
      box-shadow: 
        0 0 40px var(--accent-glow),
        0 10px 30px rgba(0, 0, 0, 0.8),
        inset 0 0 16px rgba(0, 255, 136, 0.25);
    }

    .power-svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: var(--dim);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.3s;
    }

    .power-btn.on .power-svg {
      stroke: var(--accent-on);
      filter: drop-shadow(0 0 8px var(--accent-on));
    }

    .power-state-text {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--dim);
      transition: color 0.3s;
    }

    .power-btn.on .power-state-text {
      color: var(--accent-on);
      text-shadow: 0 0 10px var(--accent-on);
    }

    /* Channel Switcher Card */
    .channel-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .channel-card.active {
      border-color: rgba(0, 255, 136, 0.3);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .channel-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .channel-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #090b0e;
      border: 1px solid #1a1e27;
      border-radius: 8px;
      padding: 2px 6px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #9aa2b4;
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      padding: 0 6px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.15s;
    }

    .nav-btn:active {
      color: var(--accent-on);
    }

    .channel-index {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .station-name {
      font-family: var(--display);
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-genre {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.04em;
    }

    /* Minimal Volume Bar */
    .vol-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 2px;
    }

    .vol-txt {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
    }

    .vol-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #1c212c;
      border-radius: 2px;
      outline: none;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <!-- Top Status Bar -->
    <div class="top-bar">
      <div id="statusBadge" class="badge-status">
        <span class="dot"></span>
        <span id="statusText">STANDBY</span>
      </div>
      <div class="app-title">SUNI TECHNO</div>
      <div class="bpm-tag">144 BPM</div>
    </div>

    <!-- Center Stage: 1 Button Only -->
    <div class="center-stage">
      <canvas id="radarCanvas" width="260" height="260"></canvas>
      <button id="masterBtn" class="power-btn" onclick="togglePower()">
        <svg class="power-svg" viewBox="0 0 24 24">
          <path d="M12 2v10M18.36 6.64a9 9 0 1 1-12.73 0"/>
        </svg>
        <span id="powerText" class="power-state-text">POWER</span>
      </button>
    </div>

    <!-- Channel Selector Card -->
    <div id="channelCard" class="channel-card">
      <div class="card-top">
        <span class="channel-label">HARD TRANSMISSION</span>
        <div class="channel-nav">
          <button class="nav-btn" onclick="prevChannel()" title="Previous Channel">‹</button>
          <span class="channel-index" id="chCounter">01 / 04</span>
          <button class="nav-btn" onclick="nextChannel()" title="Next Channel">›</button>
        </div>
      </div>

      <div class="station-name" id="chName">SUNSHINE HARD</div>
      <div class="station-genre" id="chGenre">192 KBPS // HARDTECHNO GERMANY</div>

      <div class="vol-wrapper">
        <span class="vol-txt">VOL</span>
        <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="0.85" oninput="setVol(this.value)">
      </div>
    </div>
  </div>

  <!-- Native Audio (Zero CORS restriction) -->
  <audio id="liveAudio" preload="none"></audio>

  <script>
    // 4 High-Grade Techno Channels
    const CHANNELS = [
      {
        name: "SUNSHINE HARD",
        genre: "192 KBPS // HARDTECHNO HQ",
        url: "https://sunsl.streamabc.net/sunsl_w4pk5n9ou_0dfk-mp3-192-4232604"
      },
      {
        name: "RAUTEMUSIK RAVE",
        genre: "192 KBPS // HYPERTECHNO & HARDGROOVE",
        url: "https://breakz-high.rautemusik.fm/?ref=suni"
      },
      {
        name: "SECTOR TECHNO",
        genre: "256 KBPS // UNDERGROUND CLUB ROTATION",
        url: "https://secure.live-streams.nl/main"
      },
      {
        name: "909 SYNTH ENGINE",
        genre: "ANALOG DSP // 144 BPM OFFLINE GENERATOR",
        url: "synth"
      }
    ];

    let currentCh = 0;
    let isPlaying = false;
    let audioCtx = null;
    let synthInterval = null;

    const audio = document.getElementById("liveAudio");
    const masterBtn = document.getElementById("masterBtn");
    const powerText = document.getElementById("powerText");
    const statusBadge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    const channelCard = document.getElementById("channelCard");
    const chName = document.getElementById("chName");
    const chGenre = document.getElementById("chGenre");
    const chCounter = document.getElementById("chCounter");
    const canvas = document.getElementById("radarCanvas");
    const ctx = canvas.getContext("2d");

    // Toggle Master Power
    function togglePower() {
      if (!isPlaying) {
        turnOn();
      } else {
        turnOff();
      }
    }

    function turnOn() {
      isPlaying = true;
      masterBtn.classList.add("on");
      powerText.innerText = "ONLINE";
      statusBadge.classList.add("live");
      statusText.innerText = "ON AIR";
      channelCard.classList.add("active");

      playChannel(currentCh);
    }

    function turnOff() {
      isPlaying = false;
      masterBtn.classList.remove("on");
      powerText.innerText = "POWER";
      statusBadge.classList.remove("live");
      statusText.innerText = "STANDBY";
      channelCard.classList.remove("active");

      audio.pause();
      audio.src = "";
      stopSynth();
    }

    // Play Channel
    function playChannel(index) {
      currentCh = index;
      const ch = CHANNELS[index];

      chName.innerText = ch.name;
      chGenre.innerText = ch.genre;
      chCounter.innerText = `0${index + 1} / 04`;

      if (ch.url === "synth") {
        audio.pause();
        audio.src = "";
        startSynth();
      } else {
        stopSynth();
        audio.src = ch.url;
        audio.load();
        audio.play().catch(e => {
          console.warn("Stream blocked or dropped, falling back to 909 synth:", e);
          startSynth();
        });
      }
    }

    function nextChannel() {
      currentCh = (currentCh + 1) % CHANNELS.length;
      updateUI();
      if (isPlaying) playChannel(currentCh);
    }

    function prevChannel() {
      currentCh = (currentCh - 1 + CHANNELS.length) % CHANNELS.length;
      updateUI();
      if (isPlaying) playChannel(currentCh);
    }

    function updateUI() {
      const ch = CHANNELS[currentCh];
      chName.innerText = ch.name;
      chGenre.innerText = ch.genre;
      chCounter.innerText = `0${currentCh + 1} / 04`;
    }

    function setVol(v) {
      audio.volume = v;
    }

    // Web Audio 909 Offline Synth Fallback
    function initContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function startSynth() {
      initContext();
      stopSynth();
      const intervalMs = (60 / 144) * 1000 / 2;
      let step = 0;

      synthInterval = setInterval(() => {
        if (!isPlaying || !audioCtx) return;
        const t = audioCtx.currentTime;
        if (step % 2 === 0) {
          // 909 Kick
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(36, t + 0.12);
          gain.gain.setValueAtTime(0.9, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.28);
        } else {
          // Hat
          const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.04, audioCtx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          const filt = audioCtx.createBiquadFilter();
          filt.type = "highpass";
          filt.frequency.value = 8000;
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.035);
          src.connect(filt);
          filt.connect(gain);
          gain.connect(audioCtx.destination);
          src.start(t);
          src.stop(t + 0.04);
        }
        step = (step + 1) % 16;
      }, intervalMs);
    }

    function stopSynth() {
      if (synthInterval) {
        clearInterval(synthInterval);
        synthInterval = null;
      }
    }

    // Visualizer Canvas
    let angle = 0;
    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);

      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = 105;

      ctx.clearRect(0, 0, w, h);

      // Radar Ring
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = isPlaying ? "rgba(0, 255, 136, 0.4)" : "rgba(255, 42, 68, 0.2)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      if (!isPlaying) {
        angle += 0.015;
        ctx.beginPath();
        ctx.arc(cx, cy, radius + 3, angle, angle + 0.6);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
        ctx.lineWidth = 2;
        ctx.stroke();
        return;
      }

      // Live Pulse Wave
      angle += 0.03;
      const bars = 28;
      for (let i = 0; i < bars; i++) {
        const theta = (i / bars) * Math.PI * 2 + angle;
        const wave = Math.sin(angle * 3 + i) * 8 + 12;

        const x1 = cx + Math.cos(theta) * (radius - 2);
        const y1 = cy + Math.sin(theta) * (radius - 2);
        const x2 = cx + Math.cos(theta) * (radius + wave);
        const y2 = cy + Math.sin(theta) * (radius + wave);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = "#00ff88";
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }
    }
    renderVisualizer();

    // Keyboard controls
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") nextChannel();
      if (e.key === "ArrowLeft") prevChannel();
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        togglePower();
      }
    });

    // Touch swipe left/right on channel card
    let touchStartX = 0;
    channelCard.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    channelCard.addEventListener("touchend", e => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (diff > 40) prevChannel();
      if (diff < -40) nextChannel();
    }, { passive: true });
  </script>
</body>
</html>
